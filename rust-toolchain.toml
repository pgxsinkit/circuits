# The pinned toolchain: Rust 1.99.0, the first stable release after 1.96.0 that compiles dbsp.
#
# Why a pin at all: every stable rustc from 1.97.0 to 1.98.1 hits an internal compiler error (a
# rustc_next_trait_solver panic in structural_traits.rs) while compiling dbsp. The workspace sat on
# 1.96.0, the last stable that builds it, and with it every Rust dependency was held back, until
# 1.99.0 fixed the panic. The dependency updates were prepared and validated on its beta,
# 1.99.0-beta.6 (the dated toolchain beta-2026-09-18), before switching to stable on 2026-10-01.
#
# 1.99.0 is also what CI installs (actions-rust-lang/setup-rust-toolchain reads this file) and what
# the two container/Containerfile.* build stages use (`FROM docker.io/amd64/rust:1.99.0-trixie`),
# so local, CI and image builds all share one compiler. The images are published for amd64 only.
#
# The pin covers the whole workspace, the log server (apps/durable-streams) included. The log
# server is not what holds it back: it has no dbsp, its declared MSRV is 1.75, and it builds on
# anything newer, so it moves when the engine can.
#
# NOTE for mise users: mise exports RUSTUP_TOOLCHAIN, which rustup ranks ABOVE this
# file, so a global `rust = "latest"` would silently override the pin. The repo's
# mise.toml turns on `idiomatic_version_file_enable_tools` for rust, so mise takes the
# version from this file instead.
[toolchain]
channel = "1.99.0"
