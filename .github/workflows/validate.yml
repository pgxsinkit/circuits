# Everything that has to pass before a change is accepted or an image is published. Called by
# ci.yml (pull requests) and by images.yml (pushes to develop, and release tags).
#
# The jobs call the same lane scripts as a local `bun run validate:full`. scripts/validate.ts owns
# the commands, release profile and protocol configuration matrix. The image workflow subsequently
# qualifies the candidate image pair before publishing it. CI has no mise, so
# scripts/with-toolchain.sh runs cargo as it is and rustup takes the version from rust-toolchain.toml.
#
# The engine and the log server are tested from the one workspace at the one commit, so the engine's
# conformance suite always runs against the log server built beside it.
name: validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: format + lint + Rust tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      protocol-matrix: ${{ steps.protocol-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # Reads rust-toolchain.toml, the one pin CI, the container builds and local work share.
      # `rustflags: ""` because the action's default (`-D warnings`) would turn every rustc warning
      # in either crate into a build failure; clippy below is where warnings are denied.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          rustflags: ""

      # Bun includes the formatter; oxlint is a dev dependency. No `bun-version`: setup-bun reads package.json's
      # `packageManager`, which mise.toml matches.
      - uses: oven-sh/setup-bun@v2

      # oxlint starts under node; the version is mise.toml's.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: bun install --frozen-lockfile

      - name: Protocol configurations
        id: protocol-matrix
        run: bun run validate:protocol:matrix

      - name: Format, lint and Rust tests
        run: bun run validate:rust

      - name: Upload the log server binary
        uses: actions/upload-artifact@v7
        with:
          name: durable-streams-server
          path: target/release-durable-streams/durable-streams-server
          retention-days: 1

  harness:
    name: typecheck + TypeScript unit tests + engine conformance
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""

      # No `bun-version`: setup-bun reads package.json's `packageManager`, which mise.toml matches.
      - uses: oven-sh/setup-bun@v2

      # vitest runs under node; the version is mise.toml's.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Install the supported server major from PostgreSQL's official Ubuntu repository.
      # Disable automatic cluster creation; the harness owns its ephemeral cluster.
      - name: Install PostgreSQL 19 server binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-19
          echo /usr/lib/postgresql/19/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/19/bin/initdb --version

      - run: bun install --frozen-lockfile

      - name: Typecheck, TypeScript tests and engine conformance
        run: bun run validate:harness

  durable-streams-conformance:
    name: log server conformance (${{ matrix.config }})
    needs: rust
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust.outputs.protocol-matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: bun install --frozen-lockfile

      - name: Download the log server binary
        uses: actions/download-artifact@v8
        with:
          name: durable-streams-server
          path: ${{ runner.temp }}/durable-streams

      - name: Make the binary executable
        run: chmod +x "$RUNNER_TEMP/durable-streams/durable-streams-server"

      # Reuse the release binary built and tested by the Rust lane.
      - name: Run conformance (${{ matrix.config }})
        run: bun run validate:protocol ${{ matrix.config }} "$RUNNER_TEMP/durable-streams/durable-streams-server"
