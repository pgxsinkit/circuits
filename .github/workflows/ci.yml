# Pull requests are validated and publish nothing. Pushes to develop and release tags are validated
# by images.yml, which publishes only when validation passes.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
